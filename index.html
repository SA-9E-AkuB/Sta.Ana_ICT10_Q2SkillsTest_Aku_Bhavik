<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Agent Finder</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://wallpapercave.com/wp/wp9236229.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        .main-card {
            background-color: rgba(15, 25, 35, 0.94);
            border: 1px solid #ff4655;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            color: #ece8e1;
            padding: 25px;
        }

        .sidebar-card {
            background-color: rgba(15, 25, 35, 0.94);
            border: 1px solid #383e45;
            border-radius: 12px;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            color: #ece8e1;
            padding: 20px;
        }

        h2 {
            color: #ff4655;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .sidebar-card h4 {
            color: #ff4655;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #8b9bb4;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #ece8e1;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-control {
            background-color: #1f2833;
            border: 1px solid #383e45;
            color: white;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .form-control:focus {
            background-color: #1f2833;
            color: white;
            border-color: #ff4655;
            box-shadow: 0 0 5px rgba(255, 70, 85, 0.5);
        }

        .btn-custom {
            background-color: #ff4655;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: 700;
            width: 100%;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .btn-custom:hover {
            background-color: #fa3140;
            color: white;
        }

        .result-section {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #2a3441;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .agent-list {
            font-size: 0.88rem;
            line-height: 1.6;
            margin: 0;
            padding-left: 0;
            list-style: none;
            color: #d0d5dd;
        }

        .agent-list li {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container-wrapper">
        <div class="main-card">
            <h2>VALORANT</h2>
            <div class="subtitle">Agent Finder (Type Name or Number)</div>

            <label for="agent_input" class="form-label">Enter Agent Name or Number:</label>
            <input type="text" id="agent_input" class="form-control" placeholder="e.g. Jett or 1">

            <button class="btn btn-custom" py-click="search_agent">Check Details</button>

            <div class="result-section" id="result">
                <i>Results will show here...</i>
            </div>
        </div>

        <div class="sidebar-card">
            <h4>📋 Agent Directory</h4>
            <div class="subtitle" style="margin-bottom: 12px;">Reference List (1 to 10)</div>
            <ul class="agent-list">
                <li>1. Jett</li>
                <li>2. Reyna</li>
                <li>3. Omen</li>
                <li>4. Iso</li>
                <li>5. Fade</li>
                <li>6. Sova</li>
                <li>7. Viper</li>
                <li>8. Killjoy</li>
                <li>9. Cypher</li>
                <li>10. Chamber</li>
            </ul>
        </div>
    </div>

    <script type="py" src="main.py" config='{"packages": []}'></script>

</body>
</html>
